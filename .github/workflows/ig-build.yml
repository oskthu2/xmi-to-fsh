name: Build FHIR IGs from XMI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege default; build-ig grants itself write access for the
# gh-pages deploy step.
permissions:
  contents: read

# Avoid overlapping publishes to gh-pages.
concurrency:
  group: ig-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: turn every xmi-input/*.xmi file into its own IG directory under
  # igs/<slug>/ (named after the file), then ask SUSHI to compile+validate
  # each one independently. This is the fast gate: if any IG's FSH doesn't
  # compile, nothing else runs.
  extract-and-validate:
    name: Extract FSH from XMI & validate with SUSHI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install SUSHI
        run: npm ci

      - name: Generate one IG per XMI file
        run: python3 scripts/xmi_to_fsh.py --input xmi-input --output-root igs

      - name: Validate every IG's FSH with SUSHI
        env:
          SUSHI_CMD: npx sushi
        run: bash scripts/validate_all_igs.sh

      # upload-artifact computes the least-common-ancestor of everything
      # matched below as the artifact root — here that's "igs" itself, since
      # paths diverge into igs/<slug>/... right after it — so download this
      # artifact back into a directory named "igs" to restore the layout.
      - name: Upload generated IGs
        uses: actions/upload-artifact@v4
        with:
          name: generated-igs
          path: |
            igs/*/sushi-config.yaml
            igs/*/ig.ini
            igs/*/input/**
          if-no-files-found: error
          retention-days: 7

  # Step 2: build every IG's full website with the HL7 FHIR IG Publisher,
  # reusing exactly the FSH that was just validated. Only runs if step 1
  # succeeded.
  build-ig:
    name: Build IGs with FHIR IG Publisher
    needs: extract-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI globally (IG Publisher shells out to it)
        run: |
          version=$(node -p "require('./package.json').devDependencies['fsh-sushi']")
          npm install -g "fsh-sushi@${version}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Every IG's template (fhir2.base.template, set in its ig.ini) renders
      # its site with Jekyll, which isn't preinstalled on the runner.
      - name: Set up Ruby (for Jekyll)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Jekyll
        run: gem install jekyll

      - name: Download generated IGs from step 1
        uses: actions/download-artifact@v4
        with:
          name: generated-igs
          path: igs

      - name: Get current week (cache key for the IG Publisher jar)
        id: week
        run: echo "value=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # Cached per calendar week so the jar isn't re-downloaded on every
      # run, but still picks up new IG Publisher releases regularly.
      - name: Cache IG Publisher jar
        id: cache-publisher
        uses: actions/cache@v4
        with:
          path: publisher.jar
          key: ig-publisher-${{ steps.week.outputs.value }}

      - name: Download latest IG Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          curl -fL -o publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar"

      # For each igs/<slug>/, runs SUSHI (the publisher doesn't invoke it
      # itself) then the IG Publisher, and collects the built site into
      # site/<slug>/, plus a landing page at site/index.html linking to all
      # of them.
      - name: Build every IG
        env:
          SUSHI_CMD: sushi
          PUBLISHER_JAR: ${{ github.workspace }}/publisher.jar
        run: bash scripts/build_all_igs.sh

      - name: Upload built IG sites
        uses: actions/upload-artifact@v4
        with:
          name: ig-sites
          path: site/**
          retention-days: 14

      - name: Publish IG sites to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
